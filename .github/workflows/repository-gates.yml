name: Repository gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  patch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check the proposed merge for whitespace errors
        uses: docker://alpine/git@sha256:2306e2b05ee0ef99f5d25b0779f645b24ae9f91ba187107503592fcdfe78da3a # 2.54.1
        with:
          args: -c safe.directory=/github/workspace diff --check ${{ github.event.pull_request.base.sha }} HEAD

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits added by the pull request with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace/.git
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        with:
          # Scan the Git directory so a PR's .gitleaksignore cannot suppress findings.
          args: >-
            git --no-banner --redact=100 --ignore-gitleaks-allow
            --gitleaks-ignore-path=/dev/null
            --log-opts="--diff-merges=first-parent ${{ github.event.pull_request.base.sha }}..HEAD" .git
